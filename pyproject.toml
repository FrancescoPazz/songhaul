# Used by `flet build` to package the desktop and Android apps. The CLI only needs requirements.txt.
[project]
name = "songhaul"
version = "1.0.0"  # keep in sync with songhaul/__init__.py
description = "Download playlists and songs from YouTube, YouTube Music and SoundCloud as MP3 or M4A"
requires-python = ">=3.10"
dependencies = ["flet==1.1.2", "yt-dlp>=2026.11.23"]

[tool.flet]
org = "io.github.francescopazz"
# The id from before the rename, for good: Android updates, and the data folder on macOS and Linux, depend on it.
bundle_id = "io.github.francescopazz.yt-music-playlist-downloader"
product = "Songhaul"
company = "Francesco Pazzaglia"
copyright = "Copyright (c) 2026 Francesco Pazzaglia"

[tool.flet.app]
exclude = ["downloads", "spike", "tests", "docs", "build", ".venv", "android", "DEVLOG.md", "ROADMAP.md",
           "README.md", "README.it.md", "requirements.txt", "downloader.py"]

[tool.flet.windows]
dependencies = ["yt-dlp[default]>=2026.11.23", "imageio-ffmpeg", "pillow"]

[tool.flet.macos]
dependencies = ["yt-dlp[default]>=2026.11.23", "imageio-ffmpeg", "pillow"]

[tool.flet.linux]
dependencies = ["yt-dlp[default]>=2026.11.23", "imageio-ffmpeg", "pillow"]

[tool.flet.android]
# Pure-Python parts of yt-dlp[default] (its native extras aren't needed for YouTube), plus QuickJS and the
# ytmpd_android extension from android/wheels: build with PIP_FIND_LINKS pointing there. Keep yt-dlp-ejs at the
# version yt-dlp pins.
dependencies = ["yt-dlp-ejs==0.8.0", "mutagen", "certifi", "requests", "pillow", "ytmpd-qjs==0.18.0",
                "ytmpd-android==0.2.0"]
legacy_packaging = true  # extracts libqjs.so to disk, the only place Android lets an app execute files from

# receive_sharing_intent compiles Java for 1.8 and Kotlin for 17; next to flutter_foreground_task the Kotlin Gradle
# plugin turns that mismatch into an error. A warning is enough: the code runs on Java 17 either way.
[tool.flet.android.gradle_properties]
"kotlin.jvm.target.validation.mode" = "warning"

# "Open with" for playlist and YouTube Music song links. Android 12+ opens unverified links in the browser unless the user turns on
# "Open supported links" for the app in its system settings.
[[tool.flet.android.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [
    { scheme = "https", host = "music.youtube.com", pathPrefix = "/playlist" },
    { scheme = "https", host = "www.youtube.com", pathPrefix = "/playlist" },
    { scheme = "https", host = "m.youtube.com", pathPrefix = "/playlist" },
    { scheme = "https", host = "music.youtube.com", pathPrefix = "/watch" },  # songs; not www: every video
]

# Long downloads with the screen off: the foreground service of ytmpd_android (flutter_foreground_task).
[tool.flet.android.permission]
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_DATA_SYNC" = true
"android.permission.POST_NOTIFICATIONS" = true

[tool.flet.android.service."com.pravera.flutter_foreground_task.service.ForegroundService"]
foregroundServiceType = "dataSync"
exported = false

# Share → Songhaul: ytmpd_android hands the shared text to Python.
[[tool.flet.android.activity.intent_filter]]
actions = ["android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]
data = { mimeType = "text/plain" }
